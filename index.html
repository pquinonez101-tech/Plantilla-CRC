<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
    <title>Tarjeta CRC</title>
    <style>
         h1{
            text-align: center;
        }

        .tarjeta{
            width: 400px;
            border: 2px solid black;
            background-color: white;
            margin: 20px auto;
            padding: 10px;
        }

        .titulo{
            text-align: center;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
        }

        .seccion{
            margin-top: 15px;
        }

        ul{
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Plantilla CRC</h1>

    <div class="tarjeta">

        <div class="titulo">
            <h2>Cliente</h2>
        </div>

        <div class="seccion">
            <h3>Responsabilidades</h3>
            <ul>
                <li>Realizar pedidos</li>
                <li>Consultar productos</li>
                <li>Actualizar datos</li>
            </ul>
        </div>

        <div class="seccion">
            <h3>Colaboradores</h3>
            <ul>
                <li>Pedido</li>
                <li>Producto</li>
            </ul>
        </div>

    </div>
</html>
